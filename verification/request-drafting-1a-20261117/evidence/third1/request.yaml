schema: datafarm.request/1
request_id: put-the-mug-on-the-shelf
robot: airbot_single_g2
task: put the mug on the shelf
scene:
  objects:
  - object_id: object.table
    category: table
    role: background
    constraints:
      support: floor
    count: 1
  - object_id: object.shelf
    category: shelf
    role: receptacle
    constraints:
      support: floor
    count: 1
  - object_id: object.mug
    category: mug
    role: task_object
    constraints:
      support: object.table
    count: 1
episodes: 50
seeds:
  dev:
  - 0
  - 99
  holdout:
  - 1000
  - 1019
cameras:
- head
render:
  engine: isaac_rtx
  views:
  - head
  - third_person
  materials: 2
  lights: 2
dataset:
  format: hdf5
