schema: datafarm.request/1
request_id: put-the-shallow-plate-into-the-open-drawer
robot: airbot_single_g2
task: put the shallow plate into the open drawer
scene:
  objects:
  - object_id: object.table
    category: table
    role: background
    constraints:
      support: floor
    count: 1
  - object_id: object.cabinet
    category: drawer_cabinet
    role: receptacle
    constraints:
      joint: prismatic
      joint_state: open
      support: floor
    count: 1
  - object_id: object.plate
    category: plate
    role: task_object
    constraints:
      shape: raised_rim
      support: object.table
    count: 1
episodes: 20
seeds:
  dev:
  - 0
  - 99
  holdout:
  - 1000
  - 1019
cameras:
- head
- left_wrist
render:
  engine: isaac_rtx
  views:
  - head
  - third_person
  materials: 2
  lights: 2
dataset:
  format: hdf5
